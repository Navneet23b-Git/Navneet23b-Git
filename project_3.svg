<svg xmlns="http://www.w3.org/2000/svg" width="272" height="272" viewBox="0 0 272 272">
  <defs>
    <style>
      .card-title { font: 600 15px "Segoe UI", -apple-system, sans-serif; fill: #ffffff; }
      .card-desc { font: 400 13px "Segoe UI", -apple-system, sans-serif; fill: #8b949e; }
      .tag-text { font: 500 11px "Segoe UI", -apple-system, sans-serif; fill: #8b949e; }
      .tag-text-green { font: 500 11px "Segoe UI", -apple-system, sans-serif; fill: #3fb950; }
      .tag-text-orange { font: 500 11px "Segoe UI", -apple-system, sans-serif; fill: #d29922; }
      .stats { font: 400 12px "Segoe UI", -apple-system, sans-serif; fill: #8b949e; }
      .bg-rect { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .tag-rect { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    </style>
    <clipPath id="imgClip"><rect x="0" y="0" width="240" height="110" rx="6"/></clipPath>
    </defs>
  <rect class="bg-rect" x="1" y="1" width="270" height="270" rx="8"/>
  <text x="15" y="28" font-size="16">🔍</text>
  <text x="40" y="27" class="card-title">AI PR Reviewer</text>
  <g transform="translate(15, 45)">
    <image href="data:image/jpeg;base64," width="240" height="110" preserveAspectRatio="xMidYMid slice" clip-path="url(#imgClip)"/>
  </g>
  <text x="15" y="180" class="card-desc">AI tool that reviews pull requests,</text>
  <text x="15" y="198" class="card-desc">suggests improvements and detects bugs.</text>
  <rect class="tag-rect" x="15" y="215" width="61.5" height="22" rx="11"/>
  <text x="45.75" y="230" class="tag-text-green" text-anchor="middle">Node.js</text>
  <rect class="tag-rect" x="84.5" y="215" width="55.0" height="22" rx="11"/>
  <text x="112.0" y="230" class="tag-text" text-anchor="middle">OpenAI</text>
  <rect class="tag-rect" x="147.5" y="215" width="81.0" height="22" rx="11"/>
  <text x="188.0" y="230" class="tag-text" text-anchor="middle">TypeScript</text>
  <text x="15" y="255" font-size="13">⭐</text>
  <text x="35" y="254" class="stats">164</text>
  <text x="75" y="255" font-size="13">🔄</text>
  <text x="95" y="254" class="stats">27</text>
</svg>