<svg width="650" height="240" viewBox="0 0 650 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .typing {
                font-family: 'Inter', monospace;
                font-size: 16px;
                fill: #38BDF8;
                font-weight: 600;
            }
            .code { font-family: monospace; fill: #94A3B8; font-size: 14px; }
            .glow { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');
        </style>
        <clipPath id="rounded">
            <rect width="650" height="240" rx="16" />
        </clipPath>
    </defs>
    
    <g clip-path="url(#rounded)">
        <rect width="650" height="240" fill="#090B10" />
        <image href="https://raw.githubusercontent.com/Navneet23b-Git/Navneet23b-Git/main/assets/hero.png" width="650" height="240" preserveAspectRatio="xMidYMid slice" opacity="0.6"/>
        
        <!-- Overlay Gradient -->
        <rect width="650" height="240" fill="url(#grad)" />
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#090B10" stop-opacity="1" />
            <stop offset="60%" stop-color="#090B10" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#090B10" stop-opacity="0" />
        </linearGradient>

        <text x="30" y="60" font-family="'Inter', sans-serif" font-size="20" fill="#F8FAFC" font-weight="bold">Hi there! 👋</text>
        <text x="30" y="105" font-family="'Inter', sans-serif" font-size="40" fill="#F8FAFC" font-weight="800">I'm <tspan fill="#3B82F6">Navneet</tspan></text>
        
        <text x="30" y="145" class="code">while (learning) {</text>
        <text x="50" y="170" class="code">  <tspan fill="#38BDF8">build</tspan>();</text>
        <text x="50" y="195" class="code">  <tspan fill="#38BDF8">automate</tspan>();</text>
        <text x="50" y="220" class="code">  <tspan fill="#38BDF8">repeat</tspan>();</text>
        <text x="30" y="245" class="code">}</text>
    </g>
</svg>