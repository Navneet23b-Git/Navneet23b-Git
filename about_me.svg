<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <style>
      .title { font: 600 22px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
      .text { font: 400 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .badge-text { font: 500 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .bg-rect { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .badge-rect { fill: #0d1117; stroke: #30363d; stroke-width: 1; transition: 0.3s; }
      .emoji { font-size: 20px; }
      .badge-emoji { font-size: 15px; }
    </style>
  </defs>

  <!-- Outer background container -->
  <rect class="bg-rect" x="1" y="1" width="898" height="218" rx="10"/>

  <!-- Heading -->
  <text x="30" y="48" class="emoji">👨‍💻</text>
  <text x="65" y="46" class="title">About Me</text>

  <!-- Paragraph Text -->
  <text x="30" y="95" class="text">Passionate Full Stack Developer and AI Enthusiast. I love building scalable applications,</text>
  <text x="30" y="120" class="text">automating workflows and exploring the power of AI to solve real-world problems.</text>

  <!-- Badges Container -->
  <!-- Badge 1 -->
  <g transform="translate(30, 160)">
    <rect class="badge-rect" x="0" y="0" width="220" height="32" rx="6"/>
    <text x="12" y="21" class="badge-emoji">🎓</text>
    <text x="38" y="21" class="badge-text">B.Tech CSE @ IIT Guwahati</text>
  </g>

  <!-- Badge 2 -->
  <g transform="translate(265, 160)">
    <rect class="badge-rect" x="0" y="0" width="235" height="32" rx="6"/>
    <text x="12" y="21" class="badge-emoji">💼</text>
    <text x="38" y="21" class="badge-text">SWE Intern @ AlgoUniversity</text>
  </g>

  <!-- Badge 3 -->
  <g transform="translate(515, 160)">
    <rect class="badge-rect" x="0" y="0" width="155" height="32" rx="6"/>
    <text x="12" y="21" class="badge-emoji">🌱</text>
    <text x="38" y="21" class="badge-text">Lifelong Learner</text>
  </g>

  <!-- Badge 4 -->
  <g transform="translate(685, 160)">
    <rect class="badge-rect" x="0" y="0" width="185" height="32" rx="6"/>
    <text x="12" y="21" class="badge-emoji">🚀</text>
    <text x="38" y="21" class="badge-text">Open Source Enthusiast</text>
  </g>
</svg>
